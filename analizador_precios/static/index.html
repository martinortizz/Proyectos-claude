<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analizador de Precios</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #667085; --border: #e3e6eb;
    --accent: #2f6fed; --muy-barato: #0f8a4a; --barato: #4caf50; --promedio: #d99a00; --caro: #d4382c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e7e9ee; --muted: #9aa3b2; --border: #2c323d;
      --accent: #6c9bff; --muy-barato: #3ecf8e; --barato: #7bd88f; --promedio: #f2c14e; --caro: #ff6b5e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 920px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
  form { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); }
  input { font: inherit; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); min-width: 0; }
  .fila-boton { grid-column: 1 / -1; display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
  .fila-boton label { flex: 1; min-width: 200px; }
  button { font: inherit; font-weight: 600; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
  button.secundario { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  .veredicto { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .etiqueta { font-size: 1.35rem; font-weight: 700; padding: 8px 16px; border-radius: 10px; color: #fff; }
  .MUY_BARATO { background: var(--muy-barato); } .BARATO { background: var(--barato); }
  .PROMEDIO { background: var(--promedio); color: #1d2330; } .CARO { background: var(--caro); }
  .escala { position: relative; height: 10px; border-radius: 5px; margin: 20px 0 6px;
    background: linear-gradient(90deg, var(--muy-barato), var(--barato), var(--promedio), var(--caro)); }
  .marcador { position: absolute; top: -5px; width: 4px; height: 20px; background: var(--text); border-radius: 2px; transform: translateX(-2px); }
  .escala-txt { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .kpi small { color: var(--muted); display: block; }
  .kpi b { font-size: 1.1rem; font-variant-numeric: tabular-nums; }
  ul.conclusiones { margin: 16px 0 0; padding-left: 20px; }
  .aviso { color: var(--promedio); margin-top: 8px; }
  .error { color: var(--caro); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { font-size: .8rem; color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; }
  .pos { color: var(--caro); } .neg { color: var(--muy-barato); }
  .tabla-scroll { overflow-x: auto; }
  svg text { fill: var(--muted); font-size: 11px; }
  .oculto { display: none; }
  details summary { cursor: pointer; font-weight: 600; }
  details form { margin-top: 14px; grid-template-columns: 1fr 2fr 1.3fr 1fr 1fr; }
  @media (max-width: 640px) {
    form, details form { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <h1>Analizador de precios</h1>
  <p class="sub">Ingresa la marca, el detalle y el precio del producto. El sistema lo compara con los distribuidores y con su historial de precios.</p>

  <section class="card">
    <form id="form-analizar">
      <label>Marca <input name="marca" required placeholder="Samsung" list="marcas"></label>
      <label>Detalle del producto <input name="detalle" required placeholder="Galaxy S24 128GB Negro"></label>
      <label>Precio <input name="precio" required inputmode="decimal" placeholder="799.990"></label>
      <div class="fila-boton">
        <label>Guardar este precio como distribuidor (opcional) <input name="registrar" placeholder="Nombre de la tienda"></label>
        <button type="submit">Analizar precio</button>
      </div>
    </form>
    <datalist id="marcas"></datalist>
  </section>

  <section id="resultado" class="oculto"></section>

  <section class="card">
    <details>
      <summary>Registrar precio de un distribuidor</summary>
      <form id="form-precio">
        <label>Marca <input name="marca" required></label>
        <label>Detalle <input name="detalle" required></label>
        <label>Distribuidor <input name="distribuidor" required></label>
        <label>Precio <input name="precio" required inputmode="decimal"></label>
        <label>Fecha <input name="fecha" type="date"></label>
        <div class="fila-boton"><button type="submit" class="secundario">Guardar precio</button><span id="msg-precio"></span></div>
      </form>
    </details>
  </section>
</main>

<script>
const $ = (s) => document.querySelector(s);
const dinero = (x) => x == null ? "—" : "$" + x.toLocaleString("es", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const pct = (x) => x == null ? "—" : (x > 0 ? "+" : "") + x.toFixed(1).replace(".", ",") + " %";
const claseDif = (x) => x == null ? "" : x > 0 ? "pos" : x < 0 ? "neg" : "";
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CLASES = { "Muy barato": "MUY_BARATO", "Barato": "BARATO", "Precio promedio": "PROMEDIO", "Más caro que el promedio": "CARO" };

async function api(url, datos) {
  const resp = await fetch(url, datos ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(datos) } : undefined);
  const json = await resp.json();
  if (!resp.ok) throw new Error(json.error || resp.statusText);
  return json;
}

async function cargarMarcas() {
  try {
    const productos = await api("/api/productos");
    $("#marcas").innerHTML = [...new Set(productos.map((p) => p.marca))].map((m) => `<option value="${esc(m)}">`).join("");
  } catch (_) {}
}

$("#form-analizar").addEventListener("submit", async (e) => {
  e.preventDefault();
  const datos = Object.fromEntries(new FormData(e.target));
  const cont = $("#resultado");
  cont.className = "";
  cont.innerHTML = `<div class="card">Analizando…</div>`;
  try {
    const r = await api("/api/analizar", datos);
    const hist = r.producto ? await api(`/api/historial?marca=${encodeURIComponent(r.producto.marca)}&detalle=${encodeURIComponent(r.producto.detalle)}`) : [];
    cont.innerHTML = pintar(r, hist);
    cargarMarcas();
  } catch (err) {
    cont.innerHTML = `<div class="card error">${esc(err.message)}</div>`;
  }
});

$("#form-precio").addEventListener("submit", async (e) => {
  e.preventDefault();
  const datos = Object.fromEntries(new FormData(e.target));
  try {
    await api("/api/precios", datos);
    $("#msg-precio").textContent = "Precio guardado.";
    e.target.reset();
    cargarMarcas();
  } catch (err) {
    $("#msg-precio").innerHTML = `<span class="error">${esc(err.message)}</span>`;
  }
});

function pintar(r, hist) {
  const avisos = r.avisos.map((a) => `<div class="aviso">⚠ ${esc(a)}</div>`).join("");
  if (!r.clasificacion) {
    return `<div class="card"><h2>No se pudo analizar</h2>${avisos}</div>`;
  }
  const clase = CLASES[r.clasificacion];
  // Escala visual de -30 % a +30 %.
  const pos = Math.max(0, Math.min(100, (r.diferencia_pct + 30) / 60 * 100));
  const h = r.historico;
  let html = `<div class="card">
    <div class="veredicto">
      <span class="etiqueta ${clase}">${esc(r.clasificacion)}</span>
      <div><b>${dinero(r.precio)}</b> · ${pct(r.diferencia_pct)} vs. referencia ${dinero(r.precio_referencia)}<br>
      <small>Comparado con: ${esc(r.producto.marca)} ${esc(r.producto.detalle)} · confianza ${esc(r.confianza)}</small></div>
    </div>
    <div class="escala"><div class="marcador" style="left:${pos}%"></div></div>
    <div class="escala-txt"><span>−30 % (más barato)</span><span>precio de referencia</span><span>+30 % (más caro)</span></div>
    <div class="kpis">
      <div class="kpi"><small>Promedio distribuidores</small><b>${dinero(r.promedio_distribuidores)}</b><br><small class="${claseDif(r.diferencia_vs_distribuidores_pct)}">tu precio ${pct(r.diferencia_vs_distribuidores_pct)}</small></div>
      <div class="kpi"><small>Promedio histórico</small><b>${dinero(h && h.promedio)}</b><br><small class="${claseDif(r.diferencia_vs_historico_pct)}">tu precio ${pct(r.diferencia_vs_historico_pct)}</small></div>
      <div class="kpi"><small>Mínimo / máximo histórico</small><b>${dinero(h && h.minimo)}</b><br><small>máx. ${dinero(h && h.maximo)}</small></div>
      <div class="kpi"><small>Tendencia último mes</small><b class="${claseDif(h && h.tendencia_pct)}">${pct(h && h.tendencia_pct)}</b></div>
    </div>
    <ul class="conclusiones">${r.conclusiones.map((c) => `<li>${esc(c)}</li>`).join("")}</ul>
    ${avisos}
  </div>`;

  if (r.distribuidores.length) {
    html += `<div class="card"><h2>Precios actuales por distribuidor</h2><div class="tabla-scroll"><table>
      <tr><th>Distribuidor</th><th>Fecha</th><th class="num">Precio</th><th class="num">Tu precio vs. este</th></tr>
      ${r.distribuidores.map((d) => `<tr><td>${esc(d.distribuidor)}</td><td>${d.fecha}</td><td class="num">${dinero(d.precio)}</td><td class="num ${claseDif(d.diferencia_pct)}">${pct(d.diferencia_pct)}</td></tr>`).join("")}
    </table></div></div>`;
  }
  if (hist.length > 1) html += `<div class="card"><h2>Evolución del precio</h2>${grafico(hist, r.precio)}</div>`;
  return html;
}

// Promedio semanal del historial y línea horizontal con el precio ingresado.
function grafico(hist, precioUsuario) {
  const semanas = new Map();
  for (const x of hist) {
    const d = new Date(x.fecha + "T00:00:00");
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const k = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    const s = semanas.get(k) || { suma: 0, n: 0, min: Infinity };
    s.suma += x.precio; s.n++; s.min = Math.min(s.min, x.precio);
    semanas.set(k, s);
  }
  const puntos = [...semanas.entries()].sort().map(([k, s]) => ({ k, prom: s.suma / s.n, min: s.min }));
  const W = 860, H = 240, m = { l: 70, r: 12, t: 12, b: 26 };
  const valores = puntos.flatMap((p) => [p.prom, p.min]).concat(precioUsuario);
  let lo = Math.min(...valores), hi = Math.max(...valores);
  const pad = (hi - lo) * 0.08 || hi * 0.05; lo -= pad; hi += pad;
  const x = (i) => m.l + (puntos.length === 1 ? 0 : i / (puntos.length - 1)) * (W - m.l - m.r);
  const y = (v) => m.t + (1 - (v - lo) / (hi - lo)) * (H - m.t - m.b);
  const linea = (f) => puntos.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(f(p)).toFixed(1)}`).join("");
  const ticks = [0, 0.25, 0.5, 0.75, 1].map((t) => lo + t * (hi - lo));
  const etiquetasX = [0, Math.floor((puntos.length - 1) / 2), puntos.length - 1];
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolución del precio">
    ${ticks.map((v) => `<line x1="${m.l}" x2="${W - m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)"/><text x="${m.l - 6}" y="${y(v) + 4}" text-anchor="end">${dinero(Math.round(v))}</text>`).join("")}
    ${etiquetasX.map((i, j) => `<text x="${x(i)}" y="${H - 6}" text-anchor="${["start", "middle", "end"][j]}">${puntos[i].k}</text>`).join("")}
    <path d="${linea((p) => p.min)}" fill="none" stroke="var(--muy-barato)" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="${linea((p) => p.prom)}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <line x1="${m.l}" x2="${W - m.r}" y1="${y(precioUsuario)}" y2="${y(precioUsuario)}" stroke="var(--caro)" stroke-width="1.5"/>
    <text x="${W - m.r}" y="${y(precioUsuario) - 5}" text-anchor="end" style="fill:var(--caro)">Tu precio</text>
  </svg>
  <small style="color:var(--muted)"><span style="color:var(--accent)">━</span> promedio semanal · <span style="color:var(--muy-barato)">┅</span> mínimo semanal · <span style="color:var(--caro)">━</span> precio ingresado</small>`;
}

cargarMarcas();
</script>
</body>
</html>
